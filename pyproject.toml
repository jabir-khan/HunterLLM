[project]
name = "hunter-llm"
version = "0.1.0"
description = "Data pipeline and QLoRA fine-tuning for a security / bug-hunting LLM"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "tqdm>=4.66.0",
    "trafilatura>=1.9.0",
    "datasketch>=1.6.5",
    "datasets>=2.18.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
# Retrieval-augmented prompting (CPU-friendly).
rag = ["numpy>=1.24.0", "sentence-transformers>=2.6.0"]

# Full training stack — assumes a CUDA GPU. Tested with TRL 0.9.x and 1.4.x.
# bitsandbytes wheels are CUDA-only; pip will fail this extra on macOS.
train = [
    "torch>=2.1.0",
    "transformers>=4.40.0,<6.0.0",
    "accelerate>=0.30.0",
    "peft>=0.10.0",
    "trl>=0.9.0",
    "bitsandbytes>=0.43.0; platform_system == 'Linux'",
    "sentencepiece>=0.2.0",
    "wandb>=0.17.0",
]

# Faster training via Unsloth (single-GPU 4-bit, ~2x speed). Optional.
unsloth = [
    "unsloth @ git+https://github.com/unslothai/unsloth.git ; platform_system == 'Linux'",
]

dev = ["ruff>=0.4.0", "pytest>=8.0.0"]

[project.scripts]
hunter-llm = "hunter_llm.cli:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hunter_llm*"]
