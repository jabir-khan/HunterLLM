[project]
name = "hunter-llm"
version = "0.1.0"
description = "Data pipeline and QLoRA fine-tuning for a security / bug-hunting LLM"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "tqdm>=4.66.0",
    "trafilatura>=1.9.0",
    "datasketch>=1.6.5",
    "datasets>=2.18.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
]

[project.optional-dependencies]
rag = ["numpy>=1.24.0", "sentence-transformers>=2.6.0"]
train-gpu = [
    "unsloth[cu121] @ git+https://github.com/unslothai/unsloth.git",
]
dev = ["ruff>=0.4.0", "pytest>=8.0.0"]

[project.scripts]
hunter-llm = "hunter_llm.cli:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hunter_llm*"]
